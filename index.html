<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon Multimodal AI Workspace</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h1 { color: #ffffff; text-align: center; margin-bottom: 20px; }
        .section { margin-bottom: 20px; padding: 15px; background: #262626; border-radius: 8px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #b0b0b0; }
        input[type="text"], textarea { width: 100%; padding: 10px; background: #333; border: 1px solid #444; border-radius: 6px; color: #fff; box-sizing: border-box; }
        input[type="file"] { margin-bottom: 10px; }
        button { background-color: #007aff; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        .image-preview-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; margin-top: 10px; }
        .image-box { background: #333; padding: 8px; border-radius: 6px; text-align: center; }
        .image-box img { max-width: 100%; max-height: 120px; border-radius: 4px; display: block; margin: 0 auto 8px auto; }
        #output { white-space: pre-wrap; background: #000; color: #00ff00; padding: 15px; border-radius: 6px; font-family: "Courier New", Courier, monospace; min-height: 100px; max-height: 400px; overflow-y: auto; }
    </style>
</head>
<body>

<div class="container">
    <h1>Horizon Multimodal AI Workspace</h1>

    <!-- 1. API Configuration Key Box -->
    <div class="section">
        <label for="apiKey">Enter OpenRouter or OpenAI API Key:</label>
        <input type="text" id="apiKey" placeholder="sk-or-v1-...">
    </div>

    <!-- 2. Multi-Image Upload Layout -->
    <div class="section">
        <label>Upload Images:</label>
        <input type="file" id="imageInput" multiple accept="image/*">
        <div id="previewContainer" class="image-preview-container"></div>
    </div>

    <!-- 3. Instructions & Math Prompts -->
    <div class="section">
        <label for="prompt">Your Instructions / Math Problem Details:</label>
        <textarea id="prompt" rows="5" placeholder="e.g., Look at image_1 and solve the calculus problem shown, then check image_2 to see if the steps align..."></textarea>
    </div>

    <button id="submitBtn">Analyze Content & Solve Math</button>

    <!-- 4. Real-time Output Window -->
    <div class="section" style="margin-top: 20px;">
        <label>AI Response Logs:</label>
        <div id="output">Waiting for your request...</div>
    </div>
</div>

<script>
    const imageInput = document.getElementById('imageInput');
    const previewContainer = document.getElementById('previewContainer');
    const submitBtn = document.getElementById('submitBtn');
    const outputDiv = document.getElementById('output');
    
    let uploadedImages = []; // Stores image data payloads array

    // Process image uploads, handle dynamic naming, and draw previews
    imageInput.addEventListener('change', function(e) {
        previewContainer.innerHTML = '';
        uploadedImages = [];
        const files = e.target.files;

        Array.from(files).forEach((file, index) => {
            const reader = new FileReader();
            const imageName = `image_${index + 1}`; // Automatic naming convention

            reader.onload = function(event) {
                const base64Data = event.target.result.split(',')[1]; // Strip prefix metadata
                const mimeType = file.type;

                uploadedImages.push({ name: imageName, base64: base64Data, type: mimeType });

                // Create visual layout element for UI preview
                const box = document.createElement('div');
                box.className = 'image-box';
                box.innerHTML = `
                    <img src="${event.target.result}" alt="${imageName}">
                    <span style="font-size:12px; color:#aaa;">${imageName}</span>
                `;
                previewContainer.appendChild(box);
            };
            reader.readAsDataURL(file);
        });
    });

    // Handle OpenRouter Unified Multimodal API Call Integration
    submitBtn.addEventListener('click', async () => {
        const apiKey = document.getElementById('apiKey').value.trim();
        const promptText = document.getElementById('prompt').value.trim();

        if (!apiKey) { alert('Please insert your API Key first.'); return; }
        if (!promptText) { alert('Please enter some text instructions or a math problem.'); return; }

        outputDiv.innerText = "Processing tokens and analyzing image pixels... Please wait.";

        // Construct standard OpenRouter Vision payload structure
        const messageContent = [];
        
        // Contextually stitch user text instructions
        messageContent.push({ type: "text", text: promptText });

        // Loop through array and embed Base64 image contents securely
        uploadedImages.forEach(img => {
            // Inform the model of the structural name assignment right before its image data block
            messageContent.push({ type: "text", text: `[The following image asset is named: ${img.name}]` });
            messageContent.push({
                type: "image_url",
                image_url: { url: `data:${img.type};base64,${img.base64}` }
            });
        });

        try {
            const response = await fetch("https://openrouter.ai", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${apiKey}`,
                    "Content-Type": "application/json",
                    "HTTP-Referer": window.location.href, // Required for OpenRouter tracking metrics
                    "X-Title": "Horizon AI Hub"
                },
                body: JSON.stringify({
                    model: "google/gemini-flash-1.5", // Optimized engine choice for vision + complex logic calculations
                    messages: [{ role: "user", content: messageContent }]
                })
            });

            const data = await response.json();
            if (response.ok) {
                outputDiv.innerText = data.choices[0].message.content;
            } else {
                outputDiv.innerText = `API Error: ${data.error?.message || response.statusText}`;
            }
        } catch (error) {
            outputDiv.innerText = `Network Fail: ${error.message}`;
        }
    });
</script>

</body>
</html>
